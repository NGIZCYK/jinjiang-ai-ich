[build]
  base = "web"
  # The published site is the isolated course-demo experience. Clear any
  # dashboard VITE_* overrides so Vite reads the tracked .env.demo values.
  command = "env -u VITE_SUPABASE_URL -u VITE_SUPABASE_PUBLISHABLE_KEY -u VITE_SHOW_DEMO_ACCOUNTS -u VITE_DEMO_GUEST_EMAIL -u VITE_DEMO_GUEST_PASSWORD -u VITE_DEMO_OPS_EMAIL -u VITE_DEMO_OPS_PASSWORD npm run build:demo"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
